### Exclude from processing ###
## Add yours here if you have other stuff in your github.io page!!!
exclude:
  - README.md
  - README.md~
  - CONTRIBUTING.md
  - LICENSE.md
  - LICENSE.md~
  - config.yml~
  - Gemfile
  - Gemfile.lock
  - "*.log"
  - "*.ipynb"
  - "python_notebooks/*"
  - "about_me/*.yml"                                    # read as data (see data_dir above), not copied to the site
  - vendor
  - .bundle
