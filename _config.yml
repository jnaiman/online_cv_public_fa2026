###############################################################################
#  HOW TO USE THIS FILE
#   1. Fill in your info in PART 1 below (you should not need to touch PART 2)
#   2. Stop (CTRL+C) and restart your local site:  bundle exec jekyll serve
#      (changes to this file are NOT picked up by live reload -- always restart)
#   3. Push to GitHub
#
#  Note: GitHub Pages only reads a file named exactly "_config.yml", so this
#  file has to keep the underscore in its name.
###############################################################################


###############################################################################
#  PART 1: YOUR SETTINGS -- edit these!
###############################################################################

### Site Settings ###
title               : IS445 Jekyll Template
description         : >-
                      I am definitely not a corgi!
baseurl             : ""   # Leave as empty quotes if you are hosting your site at <your-username>.github.io directly,
#                            otherwise it will be hosted at <your-username>.github.io/{{base_url}}
repository          :      # Change to your GitHub username -- for example, I would put "jnaiman" without the quotes after the ":" here.
#                            Used to find the repositories you list in about_me/remote_repos.yml (if empty, "author: github" below is used)
open_new_tab        : false   # Opens external URLs in new tab (works for posts, projects and navbar only)


### Author Info ###
# Un-comment (remove the "#") any accounts you want shown as icons under your name.
author:
  name              : A. P. Corgi
  image             : https://media.tenor.com/8RcIoWTKYR4AAAAe/scuze-corgi.png
  email             : username@domain.com
  github            : jnaiman # JPN
  twitter           : your_username
  youtube           : your_channel_name
# behance           : your_username
# dribbble          : your_username
# facebook          : your_username
# gitlab            : your_username
# instagram         : your_username
# kaggle            : your_username
# linkedin          : your_username
# medium            : your_username
# soundcloud        : your_username
# spotify           : your_username
# stackoverflow     : your_user_id
# tumblr            : your_username.tumblr.com
# twitch            : your_username
# vimeo             : your_username
# keybase           : your_username


### Buy me a coffee (optional) ###
# See https://www.buymeacoffee.com/
buymeacoffee:
  enabled: false
  username: your_username
  color: "#007bff"
  message: "Thank you for visiting."                    # Message to be displayed aside from the button for a few seconds.
  description: "Support me on Buy me a coffee!"


# Want a Blog link in your navbar? It is hidden by default -- comment out
# (put a "#" in front of) the "- pages/blog.html" line under "nav_exclude" in PART 2.

# Have other things stored in your github.io repo that should NOT be part of
# your website? Add them to the "exclude" list near the bottom of PART 2.


###############################################################################
#  PART 2: ADVANCED SETTINGS -- you generally do NOT need to change anything
#  below this line.
###############################################################################

### Plugins ###
plugins:
  - jekyll-sitemap
  - jekyll-gist

# Build the same way GitHub Pages does: only the plugins listed in "whitelist"
# run, and the custom code in _plugins/ is ignored (GitHub ignores it too).
safe: true
whitelist:
  - jekyll-sitemap
  - jekyll-gist
gist:
  noscript: false                                       # same as GitHub Pages


### Port to host on locally -- change if you have multiple sites you want to host at once ###
port: 4008


### Where the About page data lives (programming-skills.yml, other-skills.yml, timeline.yml) ###
data_dir: about_me


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/blog.html                                     # Blog is off by default -- comment out this line to turn it on
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - projects/**                                         # Individual project pages (they show up on the Projects page instead)
  - documentation/partials/**                           # For Documentation Only


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  elements:                                             # For Documentation Only
    output: true                                        # For Documentation Only


### Disqus ###
disqus:
  shortname: your-short-name-disqus                     # Your website Shortname on disqus


### Analytics ###
analytics:
  enabled: false                                        # Set true to enable analytics
  google:
    tracking_id: your-google-tracking-id


### Defaults ###
defaults:
  - scope:
      path: "projects"                                  # Every file in the projects/ folder is a project page
    values:
      layout: "page"
  - scope:                                              # For Documentation Only
      path: ""                                          # For Documentation Only
      type: "elements"                                  # For Documentation Only
    values:                                             # For Documentation Only
      layout: "element"                                 # For Documentation Only
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false                                  # Set to true to enable disqus comments


